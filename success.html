<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt hàng thành công – POD</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  .success-box {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    padding: 40px 28px;
  }
  .success-icon {
    width: 72px;
    height: 72px;
    background: #dcfce7;
    color: #16a34a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    margin: 0 auto 20px;
  }
  .success-box h1 {
    font-size: 1.6rem;
    margin-bottom: 10px;
    color: #0f172a;
  }
  .success-box p {
    color: #64748b;
    margin-bottom: 28px;
    line-height: 1.6;
  }
  .success-box .button {
    width: auto;
    display: inline-flex;
    padding: 12px 28px;
  }
</style>
</head>
<body>
<header class="hero small">
  <h1>PRINT ON DEMAND (POD)</h1>
</header>

<section>
  <div class="card success-box">
    <div class="success-icon">✓</div>
    <h1>Đặt hàng thành công!</h1>
    <p>Cảm ơn bạn đã đặt hàng. Chúng tôi sẽ liên hệ xác nhận trong thời gian sớm nhất.</p>
    <a href="index.html" class="button">← Quay lại trang chủ</a>
  </div>
</section>

<footer>
  <h3>Print on Demand (POD)</h3>
  <p>© 2026</p>
</footer>
</body>
</html>
